[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --html=tests/reports/report.html
    --self-contained-html
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    ocr: OCR functionality tests